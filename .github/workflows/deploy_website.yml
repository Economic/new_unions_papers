name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'union_papers.csv'
      - 'index.qmd'
  workflow_dispatch: # Allows manual triggering

# Build and deploy run as separate jobs so the Pages artifact is fully
# registered before deploy-pages looks it up. Running them as back-to-back
# steps in one job caused intermittent "No artifacts named github-pages" errors.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: true

      - name: Install R dependencies for website
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Render Quarto site
        run: quarto render index.qmd

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
